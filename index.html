<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مراتب</title>
<meta name="description" content="مراتب مريحة بمقاسات وكثافات وأقمشة متعددة. اختر منتجك وأرسل طلبك عبر واتساب.">
<meta name="theme-color" content="#edeff8">
<meta property="og:type" content="website">
<meta property="og:title" content="مراتب">
<meta property="og:description" content="اختر المرتبة المناسبة وأرسل طلبك عبر واتساب بنقرة واحدة.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&family=Reem+Kufi:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  try {
    var t = localStorage.getItem('mx_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
</script>
</head>
<body>

<div class="demo-bar" id="demoBar" hidden></div>

<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="#top" aria-label="الصفحة الرئيسية">
      <span class="brand-mark" id="brandMark"></span>
      <span class="brand-name" id="brandName"></span>
    </a>
    <nav class="nav" aria-label="التنقل">
      <a href="#products">المنتجات</a>
      <a href="#shops">محلاتنا</a>
    </nav>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="تبديل الوضع الليلي">
      <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main id="top">

  <section class="hero" aria-labelledby="heroTitle">
    <div class="stars" id="stars" aria-hidden="true"></div>
    <div class="wrap hero-in">
      <div class="hero-copy">
        <h1 id="heroTitle"></h1>
        <p id="heroSub"></p>
        <div class="hero-cta">
          <a class="btn btn-primary" href="#products">تصفّح المراتب</a>
          <button class="btn btn-ghost" id="heroWa" type="button"><span data-wa-ico></span>اسألنا في واتساب</button>
        </div>
      </div>

      <div class="hero-art" aria-hidden="true">
        <svg viewBox="0 0 520 380" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="glow"><stop offset="0" stop-color="#f1e2b0" stop-opacity=".6"/><stop offset="1" stop-color="#f1e2b0" stop-opacity="0"/></radialGradient>
            <mask id="cres"><rect width="520" height="380" fill="#fff"/><circle cx="438" cy="58" r="30" fill="#000"/></mask>
            <pattern id="spr" width="28" height="40" patternUnits="userSpaceOnUse" patternTransform="translate(0 214)">
              <path d="M0 32 L7 8 L14 32 L21 8 L28 32" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--stitch)"/>
            </pattern>
          </defs>
          <circle cx="420" cy="70" r="92" fill="url(#glow)"/>
          <circle cx="420" cy="70" r="34" fill="#f1e2b0" mask="url(#cres)"/>
          <g class="bed">
            <rect x="112" y="298" width="28" height="28" rx="9" style="fill:var(--l-base)"/>
            <rect x="380" y="298" width="28" height="28" rx="9" style="fill:var(--l-base)"/>
            <rect x="70" y="252" width="380" height="52" rx="16" style="fill:var(--l-base)"/>
            <rect x="70" y="212" width="380" height="46" rx="12" style="fill:var(--l-spring)"/>
            <rect x="82" y="216" width="356" height="38" fill="url(#spr)"/>
            <rect x="70" y="180" width="380" height="40" rx="14" style="fill:var(--l-foam)"/>
            <rect x="62" y="140" width="396" height="50" rx="24" style="fill:var(--l-cover)"/>
            <path d="M92 165 H428" fill="none" stroke-width="2.5" stroke-dasharray="8 8" stroke-linecap="round" style="stroke:var(--stitch)"/>
            <circle cx="150" cy="165" r="4.5" style="fill:var(--stitch)"/>
            <circle cx="260" cy="165" r="4.5" style="fill:var(--stitch)"/>
            <circle cx="370" cy="165" r="4.5" style="fill:var(--stitch)"/>
            <rect x="102" y="100" width="150" height="48" rx="24" style="fill:var(--l-pillow)"/>
            <rect x="111" y="109" width="132" height="30" rx="15" fill="none" stroke-width="2" stroke-dasharray="5 6" style="stroke:var(--stitch)"/>
          </g>
          <g style="fill:var(--ink-2);font-family:var(--f-display)">
            <text x="276" y="104" font-size="22">z</text>
            <text x="300" y="76" font-size="30">z</text>
            <text x="332" y="40" font-size="40">Z</text>
          </g>
        </svg>
      </div>
    </div>
  </section>

  <section class="sec" id="products" aria-labelledby="prodTitle">
    <div class="wrap">
      <div class="sec-head">
        <div>
          <h2 id="prodTitle">مراتبنا</h2>
          <p class="sec-sub">اضغط على أي منتج لاختيار المقاس والكثافة ثم أرسل الطلب.</p>
        </div>
        <label class="search">
          <span class="sr">ابحث عن منتج</span>
          <input id="q" type="search" placeholder="ابحث عن منتج" autocomplete="off">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </label>
      </div>
      <div class="chips" id="chips" role="group" aria-label="تصفية حسب الصنف"></div>
      <div class="grid" id="grid" aria-live="polite"></div>
    </div>
  </section>

  <section class="sec" id="shops" aria-labelledby="shopTitle">
    <div class="wrap">
      <div class="sec-head">
        <div>
          <h2 id="shopTitle">محلاتنا</h2>
          <p class="sec-sub">زرنا لتجرّب المراتب بنفسك، أو راسلنا مباشرة.</p>
        </div>
      </div>
      <div class="shops" id="shopList"></div>
    </div>
  </section>

</main>

<footer class="foot">
  <div class="wrap">
    <span class="brand" style="justify-content:center;margin:0 auto"><span class="brand-name" id="footBrand"></span></span>
    <div class="foot-links" id="footLinks"></div>
    <div class="foot-text" id="footText"></div>
    <div id="footYear"></div>
  </div>
</footer>

<button class="fab" id="fab" type="button" aria-label="تواصل معنا عبر واتساب"><span data-wa-ico></span></button>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
