<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&family=Reem+Kufi:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
<script>
  try {
    var t = localStorage.getItem('mx_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
</script>
</head>
<body>

<!-- شاشة الدخول -->
<section class="login" id="loginView" hidden>
  <form class="login-card" id="loginForm" autocomplete="on">
    <h1>لوحة التحكم</h1>
    <p class="muted" id="loginNote">سجّل الدخول لإدارة المنتجات والمعلومات.</p>
    <label class="field"><span>البريد الإلكتروني</span>
      <input class="inp" type="email" id="email" autocomplete="username" required dir="ltr"></label>
    <label class="field"><span>كلمة المرور</span>
      <input class="inp" type="password" id="pass" autocomplete="current-password" required dir="ltr"></label>
    <div class="err" id="loginErr" role="alert"></div>
    <button class="btn btn-primary" type="submit" id="loginBtn">دخول</button>
    <a class="muted center" href="index.html">العودة إلى الموقع</a>
  </form>
</section>

<!-- التطبيق -->
<div id="appView" hidden>
  <div class="demo-bar" id="demoBar" hidden></div>
  <header class="adm-top">
    <div class="adm-wrap adm-top-in">
      <b class="adm-title">لوحة التحكم</b>
      <a class="btn btn-line sm" href="index.html" target="_blank" rel="noopener">عرض الموقع</a>
      <button class="btn btn-line sm" id="logoutBtn" type="button">خروج</button>
    </div>
  </header>
  <div class="adm-wrap">
    <nav class="adm-tabs" id="tabs" aria-label="الأقسام"></nav>
    <main id="panel" class="adm-panel"></main>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="db.js"></script>
<script src="admin.js"></script>
</body>
</html>
